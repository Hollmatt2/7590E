{% extends "base.html" %}

{% block title %}Submit an agreement · Calder Agreement Review{% endblock %}

{% block content %}
<h1>Submit an agreement</h1>
{# enctype="multipart/form-data" is required, or the browser sends the form without the file. #}
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Submit</button>
</form>
{% endblock %}
